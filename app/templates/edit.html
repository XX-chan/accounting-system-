<!DOCTYPE html>
<html>
    <head> 
        <title>Edit Transaction</title> 
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

<body>
     <nav class="navbar">
        <div class="nav-container">

            <ul class="nav-links">
                <li><a href="{{url_for('user.index')}}">首页</a></li>
                <li><a href="{{url_for('transaction.all_ts_page')}}">交易明细</a></li>
                <li><a href="#">汇总</a></li>
                <li><a href="{{url_for('user.login_page')}}">登录</a></li>
                <li><a href="{{url_for('user.register_page')}}">注册</a></li>
                <li><a href="{{url_for('user.logout')}}">退出登录</a></li>
            </ul>
        </div>
    </nav>

    <div>
        <h2>编辑交易</h2>
        <form method="POST" action="{{ url_for('transaction.edit_ts',ts_id=transaction.transaction_id )}}">
            <div>
                分类
                <input name="category_name" value="{{ transaction.category.category_name}}">
            </div>

            <div>
                金额
                <input name="amount" value="{{ transaction.amount}}">
            </div>
                
            <div>
                备注
                <input name="note" value="{{ transaction.note}}">
            </div>

            <div>
                日期
                <input name="date" value="{{ transaction.date}}">
            </div>

            <button type="submit"> 保存 </button>
        </form>

        {% if error %}
            <div style="color: red;">
                {{ error }}
            </div>
        {% endif %}
    </div>
</body>




</html>
