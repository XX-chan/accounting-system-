<!DOCTYPE html>
<html>
<head>
    <title>首页</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">

            <ul class="nav-links">
                <li><a href="{{url_for('user.index')}}">首页</a></li>
                <li><a href="{{url_for('transaction.all_ts_page')}}">交易明细</a></li>
                <li><a href="#">汇总</a></li>
                <li><a href="{{url_for('user.login_page')}}">登录</a></li>
                <li><a href="{{url_for('user.register_page')}}">注册</a></li>
                <li><a href="{{url_for('user.logout')}}">退出登录</a></li>
            </ul>
        </div>
    </nav>


    <div class="action-bar">
        <a href="{{url_for('transaction.add_ts_page')}}" class="action-btn">新增交易</a>
        <a href="{{url_for('category.add_cg_page')}}" class="action-btn">新增分类</a>
    </div>


    <div class="dashboard">
        <h2 class="dashboard-title">本月报告</h2>
       
        <div class="stats-grid">
            <div class="stats-label">总支出</div>
            <div class="stats-value" id="expenseAmount">¥</div>
        </div>

        <div class="stats-grid">
            <div class="stats-label">总收入</div>
            <div class="stats-value" id="incomeAmount">¥</div>
        </div>
        
        <div class="stats-grid">
            <div class="stats-label">盈余</div>
            <div class="stats-value" id="remainingAmount">¥</div>
        </div>
        
    </div>


    <div class="table-container">
        <h2 class="table-title">本月支出金额TOP 10</h2>
        <table class="expense-table">
            <thead>
                <tr>
                    <th>分类</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>日期</th>
                    <th>编辑</th>
                    <th>删除</th>
                </tr>
            </thead>

            <tbody id="expenseList"> 
                <tr>
                    <td></td>
                </tr>

            </tbody>
        </table>
    </div>


<script src="{{ url_for('static',filename='js/api.js') }}"></script>
<script src="{{ url_for('static',filename='js/render.js') }}"> </script>
<script src="{{ url_for('static',filename='js/transaction-page.js') }}"></script>
<script>
    const now=new Date();
    const year=now.getFullYear();
    const month=now.getMonth()+1;
    loadReportData({
        url:"/monthly-report",
        body:{year,month},
        expenseId:"expenseAmount",
        incomeId:"incomeAmount",
        remainingId:"remainingAmount"
    })

    const top_n=10;
    loadExpenseData({
        url:"/monthly-top",
        body:{
            year,month,top_n
        }
    })
</script>


</body>
</html>
