<!DOCTYPE html>
<html>
<head>
    <title>transaction</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
    
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="{{url_for('user.index')}}">首页</a></li>
                <li><a href="{{url_for('transaction.all_ts_page')}}">交易明细</a></li>
                <li><a href="#">汇总</a></li>
                <li><a href="{{url_for('user.login_page')}}">登录</a></li>
                <li><a href="{{url_for('user.register_page')}}">注册</a></li>
                <li><a href="{{url_for('user.logout')}}">退出登录</a></li>
            </ul>
        </div>
    </nav>



    <div class="expense-table">
        <h2> 历史交易明细 </h2>
    
            
        <form method="POST" action="{{ url_for('transaction.all_ts')}}" >
            <input id="input-year" placeholder="输入查询年份">
            <input id="input-month" placeholder="输入查询月份">

            <div>
                <button type="button" id="search-btn">查询</button>
            </div>

        </form>
            

        <table class="data-table">
            <thead>
                <tr>
                    <th>分类</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>日期</th>
                    <th>编辑</th>
                    <th>删除</th>
                </tr>
            </thead>

            <tbody id="expenseList">
                 <tr>
                    <td></td>
                </tr>
            </tbody>
        </table>

    </div>

<script src="{{ url_for('static',filename='js/api.js') }}"></script>
<script src="{{ url_for('static',filename='js/render.js') }}"> </script>
<script src="{{ url_for('static',filename='js/transaction-page.js') }}"> </script>
<script>
    window.addEventListener("DOMContentLoaded", () => { 
        const now=new Date();
        const year = now.getFullYear();
        const month = now.getMonth()+1;
        loadExpenseData({
            url:"/all_ts",
            body:{year,month}
        })
    })

    const btn =document.getElementById("search-btn")
    btn.textContent="查询";
    btn.addEventListener("click",() => { 
        const year=document.getElementById("input-year").value;
        const month=document.getElementById("input-month").value;
        loadExpenseData({
            url:"/all_ts",
            body:{year,month}
        })

    })
            
</script>
    </body>
</html>
